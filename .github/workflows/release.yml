name: Release

# Builds Conduit for the Mac, Windows and Linux from a v* tag and leaves the
# packages on a draft GitHub release named by package.json's version. A person
# publishes the draft; the website's download links and the updater then serve
# it. Each part signs only when its secrets are set, so a release before
# them is unsigned, like CI's packages.
#
# Mac (Developer ID + notarization), secrets:
#   CSC_LINK, CSC_KEY_PASSWORD        the Developer ID Application .p12 (base64) and its password
#   APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER   an App Store Connect API key
# Windows (Azure Artifact Signing):
#   secrets AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET   an app registration with the signer role
#   variables AZURE_SIGN_ENDPOINT, AZURE_SIGN_ACCOUNT, AZURE_SIGN_PROFILE, AZURE_SIGN_PUBLISHER

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Version, typecheck, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The tag must name the version the packages will carry.
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json's version $version (expected v$version)."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  package:
    name: Package (${{ matrix.platform }})
    needs: check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            os: macos-latest
          - platform: win
            os: windows-latest
          - platform: linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Package and upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM: ${{ matrix.platform }}
          # Mac
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Windows
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
        run: |
          args=()
          if [ "$PLATFORM" = mac ]; then
            if [ -n "$CSC_LINK" ]; then
              echo "Signing with the Developer ID certificate."
            else
              echo "::warning::No CSC_LINK secret: the Mac app is unsigned and won't update itself."
              export CSC_IDENTITY_AUTO_DISCOVERY=false
            fi
            if [ -n "$CSC_LINK" ] && [ -n "$APPLE_API_KEY_P8" ]; then
              # notarytool reads the API key from a file.
              key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
              printf '%s' "$APPLE_API_KEY_P8" > "$key"
              export APPLE_API_KEY="$key"
              args+=(-c.mac.notarize=true)
            else
              echo "::warning::No App Store Connect API key secrets: the Mac app isn't notarized."
            fi
          fi
          if [ "$PLATFORM" = win ]; then
            if [ -n "$AZURE_SIGN_ENDPOINT" ] && [ -n "$AZURE_CLIENT_SECRET" ]; then
              echo "Signing with Azure Artifact Signing."
              args+=(
                "-c.win.azureSignOptions.endpoint=$AZURE_SIGN_ENDPOINT"
                "-c.win.azureSignOptions.codeSigningAccountName=$AZURE_SIGN_ACCOUNT"
                "-c.win.azureSignOptions.certificateProfileName=$AZURE_SIGN_PROFILE"
                "-c.win.azureSignOptions.publisherName=$AZURE_SIGN_PUBLISHER"
              )
            else
              echo "::warning::No Artifact Signing settings: the Windows installer is unsigned."
            fi
          fi
          pnpm exec electron-builder --"$PLATFORM" --publish always "${args[@]}"
